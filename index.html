<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漫威影視追劇清單</title>
<style>
:root{--bg:#eceef3;--fg:#13172b;--mut:#646a80;--card:#fff;--bd:#cfd3df;--ac:#d62839;--ok:#1f8a5b;--chip:#e3e6ef;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--fg:#eceef6;--mut:#8f95ad;--card:#171b30;--bd:#2c3250;--ac:#ff5566;--ok:#4fcf93;--chip:#232845;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--fg:#eceef6;--mut:#8f95ad;--card:#171b30;--bd:#2c3250;--ac:#ff5566;--ok:#4fcf93;--chip:#232845;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:.02em}
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.tot{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.tot b{font-size:30px;font-weight:800;margin-right:6px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 11px;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--fg);color:var(--bg)}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;font-weight:500;font-size:13px;color:var(--mut)}
summary .all{font-size:12px;padding:3px 8px}
details[open] summary{border-bottom:1px dashed var(--bd)}
.it{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px dashed var(--bd);cursor:pointer}
.it:first-of-type{border-top:0}
.it input{width:18px;height:18px;accent-color:var(--ok);flex:none;margin:0}
.y{width:36px;flex:none;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0}
.it em{font-style:normal;font-size:11px;color:var(--mut);background:var(--chip);border-radius:4px;padding:1px 6px;flex:none}
.it.done .t{color:var(--mut);text-decoration:line-through}
.it.lock{opacity:.55;cursor:default}
body.un .it.done{display:none}
body.mu .it:not(.must){display:none}
.it.must{border-left:3px solid var(--ac);padding-left:11px}
.mk{font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:4px;padding:0 5px;flex:none}
.tabs{display:flex;gap:8px;margin:14px 0 0}.tabs button{flex:1;padding:9px}
.note{color:var(--mut);font-size:12px;margin-top:20px}
.opt{font-weight:500;font-size:11px;color:var(--mut);background:var(--chip);border-radius:4px;padding:1px 6px;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>漫威影視追劇清單</h1>
<p class="sub">依上映／首播順序整理，點一下就勾選。進度只存在這支瀏覽器。</p>
<div class="tot"><b id="pct">0%</b><span id="cnt" class="sub"></span> <span id="cnt2" class="sub"></span><div class="bar"><i id="fill"></i></div><div class="sub" id="sy" style="margin:8px 0 0">目前只存在這支瀏覽器</div></div>
<div class="tabs"><button id="t0">上映順序</button><button id="t1">官方時間線</button></div>
<div class="ctl">
<button id="bmu">只看必看</button>
<button id="bun">只看未看</button>
<button id="bop">全部展開</button>
<button id="bcl">全部收合</button>
<button id="brs">重置勾選</button>
</div>
<div class="tabs" id="stabs" hidden style="margin:0 0 10px"><button id="s0">完整（電影＋影集）</button><button id="s1">只看電影</button></div><div id="list"></div><div id="tl" hidden></div><div id="tlm" hidden></div>
<p class="note">標籤：MCU＝漫威電影宇宙；福斯＝福斯 X 戰警系列；蜘蛛人＝陶比／安德魯／索尼系列；其他＝非 MCU 的改編作品。資料更新至 2026 年 10 月 23 日，未上映作品上映後自動解鎖。非官方個人整理，片名與版權屬 Marvel Studios／Disney 所有。標示「非必需」的區塊（早期影集、短片、動畫）不計入總進度。紅框「必看」＝看《末日之戰》前建議看完的作品。「官方時間線」依 Marvel 官方 Disney+ 故事內順序排列，勾選與「上映順序」共用。</p>
</main>

function mk(p,id){
  const lk=p[3]&&now<new Date(p[3]),m=MUST.has(p[1]);
  const l=document.createElement('label');l.className='it'+(lk?' lock':'')+(m?' must':'');
  l.innerHTML='<input type="checkbox"'+(lk?' disabled':'')+'><span class="y">'+p[0]+'</span><span class="t">'+p[1]+'</span>'+(m?'<b class="mk">必看</b>':'')+'<em>'+(lk?'未上映':TG[p[2]])+'</em>';

  return {id,l,c,lk,p};
}
D.forEach((s,i)=>{
  const d=document.createElement('details');d.open=i===0||i===3;
  const sm=document.createElement('summary');

  const items=[];
  s[1].forEach((r,j)=>{
    const p=r.split('|'),id=i+'-'+j,o=mk(p,id);MAP[p[1]]=o;
    d.appendChild(o.l);items.push(o);
  });
  sm.querySelector('.all').addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();
    const mu=document.body.classList.contains('mu'),av=items.filter(x=>!x.lk&&(!mu||x.l.classList.contains('must'))),every=av.every(x=>st[x.id]);

  });

function refresh(){
  let a=0,b=0;
  for(const id in byId)byId[id].forEach(o=>{o.c.checked=!!st[id];o.l.classList.toggle('done',!!st[id])});
  const mu0=document.body.classList.contains('mu');
  tls.forEach(g=>{const it=g.items.filter(x=>!x.lk&&(!mu0||x.l.classList.contains('must')));g.n.textContent=(!it.length&&g.items.length&&!mu0)?g.items.length+' 部未上映':it.filter(x=>st[x.id]).length+' / '+it.length;g.n.parentNode.parentNode.hidden=mu0&&!it.length});
  const mi=[...MUST].map(t=>MAP[t]&&MAP[t].id).filter(Boolean);
  document.getElementById('cnt2').textContent='必看 '+mi.filter(i=>st[i]).length+' / '+mi.length;
  secs.forEach(s=>{
    const mu=document.body.classList.contains('mu'),av=s.items.filter(x=>!x.lk&&(!mu||x.l.classList.contains('must'))),dn=av.filter(x=>st[x.id]).length;
    s.sm.parentNode.hidden=mu&&!av.length;
    s.sm.querySelector('.n').textContent=(!av.length&&s.items.length&&!mu)?s.items.length+' 部未上映':dn+' / '+av.length;
    s.sm.querySelector('.all').textContent=(av.length&&dn===av.length)?'取消':'全選';
    s.items.forEach(x=>x.l.classList.toggle('done',!x.lk&&!!st[x.id]));
    if(!s.o){a+=dn;b+=av.length}
  });
  const p=b?Math.round(a/b*100):0;
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('cnt').textContent='已看 '+a+' / '+b+' 部';
  document.getElementById('fill').style.width=p+'%';
}
